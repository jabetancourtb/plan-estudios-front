
<app-navbar>

    <h1>Campos de formación</h1>

    <div style="position: relative;">

      @if(camposFormacionBubbleGraphIsLoading()) {
        <div class="spinner-container">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </div>
      }

      <div #chartContainer class="bubble-chart-container" style="width: 100%; height: 1000px;" (contextmenu)="onGlobalContextMenu($event)"></div>

      @if(menuVisible) {
        <ul
          #contextMenuRef
          [style.left.px]="menuX"
          [style.top.px]="menuY"
          class="context-menu">
          <li (click)="onOptionSelected(contextualMenuOptions.verDetalles)">{{contextualMenuOptions.verDetalles}}</li>
          <li (click)="onOptionSelected(contextualMenuOptions.irAreasFormacion)">{{contextualMenuOptions.irAreasFormacion}}</li>
          <li (click)="onOptionSelected(contextualMenuOptions.guardarImage)">{{ contextualMenuOptions.guardarImage }}</li>
          <li (click)="onOptionSelected(contextualMenuOptions.copiarImagen)">{{ contextualMenuOptions.copiarImagen }}</li>
        </ul>
      }

    </div>

</app-navbar>
