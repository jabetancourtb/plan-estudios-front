<div #chartContainer style="width: 100%; height: 600px;" (contextmenu)="onGlobalContextMenu($event)"></div>
@if(menuVisible) {
    <ul
        [style.left.px]="menuX"
        [style.top.px]="menuY"
        class="context-menu">
        <li (click)="onOptionSelected('ver')">🔍 Ver detalles</li>
        <li (click)="onOptionSelected('ir')">🔗 Ir al enlace</li>
    </ul>
}
