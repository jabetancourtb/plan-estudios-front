
<!-- Modal -->
@if(this.showModal) {
    <div class="modal-backdrop fade show"></div>

    <div class="modal fade show d-block" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">{{ title }}</h5>
                    <button type="button" class="btn-close" aria-label="Cerrar" (click)="onCancel()"></button>
                </div>
                <div class="modal-body">
                    {{ message }}
                </div>
                <div class="modal-footer mx-auto border-0">
                    <button type="button" class="btn btn-info purple-med" (click)="onCancel()">No</button>
                    <button type="button" class="btn btn-success btn-confirm-modal green-med" (click)="onConfirm()">Sí</button>
                </div>
            </div>
        </div>
    </div>
}
