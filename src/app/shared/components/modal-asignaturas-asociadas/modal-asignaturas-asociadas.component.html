
<!-- Modal -->
@if(showModal()) {
  <div class="modal-backdrop fade show"></div>

  <div class="modal fade show d-block" tabindex="-1">
      <div class="modal-dialog modal-fullscreen-sm-down modal-xl ">
          <div class="modal-content">
              <div class="modal-header">
                  <h5 class="modal-title">Asignaturas asociadas a {{asignatura().nombre}}</h5>
                  <button type="button" class="btn-close" aria-label="Cerrar" (click)="onClose()"></button>
              </div>
              <div class="modal-body">

                <app-asignaturas-asociadas
                  [asignatura]="asignatura()"
                />

              </div>
              <div class="modal-footer mx-auto border-0">
                  <button type="button" class="btn btn-danger" (click)="onClose()">Cerrar</button>
              </div>
          </div>
      </div>
  </div>
}
