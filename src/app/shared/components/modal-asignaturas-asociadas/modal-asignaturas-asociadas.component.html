
<div class="modal-fullscreen-sm-down modal-xl ">
  <div class="modal-header">
    <h5 class="modal-title">Asignaturas asociadas a {{ asignatura?.nombre }}</h5>
    <button type="button" class="btn-close" (click)="activeModal.dismiss('cerrar')"></button>
  </div>

  <div class="modal-body">
    <app-asignaturas-asociadas [asignatura]="asignatura" />
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="activeModal.close('cerrar')">Cerrar</button>
  </div>
</div>
