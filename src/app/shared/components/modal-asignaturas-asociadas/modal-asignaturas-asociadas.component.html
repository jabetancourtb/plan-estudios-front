
<div class="modal-fullscreen-sm-down modal-xl ">
  <div class="modal-header">
    <h5 class="modal-title">Asignaturas asociadas a {{ asignatura?.nombre }}</h5>
    <button type="button" class="btn-close" (click)="activeModal.dismiss('cerrar')"></button>
  </div>

  <div class="modal-body">
    <p>
      <strong style="color:red;">Visualización simplificada:</strong> Muestra únicamente las asignaturas relacionadas con la asignatura seleccionada <br>
      <strong style="color:red;">Visualización completa:</strong> Muestra el flujo de asignaturas anteriores y posteriores de la asignatura seleccionada
    </p>
    <app-asignaturas-asociadas
      [asignatura]="asignatura"
      [simplificarDiagrama]="simplificarDiagrama"
    />
  </div>

  <div class="modal-footer">

    <button type="button" class="btn btn-danger" (click)="onSimplificarDiagrama()">
      @if(simplificarDiagrama){
        Visualización completa
      }
      @else {
        Visualización simplificada
      }
    </button>

    <button type="button" class="btn btn-danger" (click)="activeModal.close('cerrar')">Cerrar</button>
  </div>
</div>
